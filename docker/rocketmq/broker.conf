# RocketMQ broker configuration for local development.
#
# brokerIP1 must be an address the application (running on the host) can reach.
# 127.0.0.1 works when the backend runs on the same machine as Docker; if you run the
# backend in a container too, set it to the broker's container IP / service name.
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
brokerIP1 = 127.0.0.1
# Auto-create the QAVideo topic on first publish (dev convenience).
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
listenPort = 10911
